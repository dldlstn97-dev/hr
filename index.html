<style>
  :root {
    --paper: #EEF0E6;
    --paper-raised: #F8F9F2;
    --ink: #232920;
    --ink-soft: #5B6155;
    --ink-faint: #8B9284;
    --ledger: #33564A;
    --ledger-dark: #223C33;
    --ledger-tint: #E1E8E1;
    --stamp-red: #A8452F;
    --stamp-red-tint: #F4E3DD;
    --amber: #A9742E;
    --amber-tint: #F2E6D3;
    --line: #D3D2BE;
    --white: #FFFFFF;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  #app { min-height: 100vh; display: flex; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 216px;
    flex-shrink: 0;
    background: var(--ledger);
    color: #EFEFE4;
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .brand-sub {
    font-size: 12px;
    color: #B9C7BC;
    margin-bottom: 30px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    border-radius: 7px;
    font-size: 14.5px;
    color: #DCE4DD;
    cursor: pointer;
    margin-bottom: 2px;
    border: none;
    background: transparent;
    text-align: left;
    width: 100%;
    font-family: var(--font);
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); }
  .nav-item.active { background: rgba(255,255,255,0.16); color: #fff; font-weight: 600; }
  .nav-divider { height: 1px; background: rgba(255,255,255,0.14); margin: 14px 0; }
  .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8FA294; padding: 0 12px; margin-bottom: 6px; margin-top: 6px; }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    font-size: 11.5px;
    color: #8FA294;
    line-height: 1.5;
  }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    padding: 30px 40px 60px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .page-title { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  .page-desc { font-size: 13.5px; color: var(--ink-soft); margin: 0; }

  .identity-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .identity-box select {
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ledger-dark);
    outline: none;
    cursor: pointer;
  }
  .role-tag {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--ledger-tint);
    color: var(--ledger-dark);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* ---------- Cards / grid ---------- */
  .grid { display: grid; gap: 16px; }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .stat-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .stat-num { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .stat-sub { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }

  .section { margin-top: 30px; }
  .section-title { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

  /* ---------- Table ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    font-weight: 600;
    padding: 0 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .empty-row td { color: var(--ink-faint); text-align: center; padding: 26px 0; font-size: 13px; }

  /* ---------- Stamp badge ---------- */
  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px 4px 8px;
    border-radius: 20px;
    letter-spacing: 0.01em;
  }
  .stamp.pending { background: var(--amber-tint); color: var(--amber); }
  .stamp.approved { background: var(--ledger-tint); color: var(--ledger-dark); }
  .stamp.rejected { background: var(--stamp-red-tint); color: var(--stamp-red); }
  .stamp::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---------- Forms ---------- */
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
  .field label { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  .field input, .field select, .field textarea {
    font-family: var(--font);
    font-size: 13.5px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--white);
    color: var(--ink);
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ledger); }
  .field textarea { resize: vertical; min-height: 56px; font-family: var(--font); }

  .btn {
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--ledger); color: #fff; }
  .btn-primary:hover { background: var(--ledger-dark); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--paper); }
  .btn-approve { background: var(--ledger-tint); color: var(--ledger-dark); }
  .btn-approve:hover { background: #CFDACF; }
  .btn-reject { background: var(--stamp-red-tint); color: var(--stamp-red); }
  .btn-reject:hover { background: #EAD0C8; }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; }
  .btn-danger-text { background: none; border: none; color: var(--stamp-red); font-size: 12.5px; cursor: pointer; font-family: var(--font); padding: 4px; }

  .name-cell { font-weight: 600; }
  .dept-tag { font-size: 11.5px; color: var(--ink-faint); }

  .callout {
    font-size: 12px;
    color: var(--ink-faint);
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 10px 13px;
    margin-top: 18px;
    line-height: 1.55;
  }

  /* ---------- Calendar ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title { font-size: 15.5px; font-weight: 700; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { font-size: 11px; text-transform: uppercase; color: var(--ink-faint); text-align: center; padding-bottom: 6px; font-weight: 600; }
  .cal-cell {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 76px;
    padding: 6px;
    font-size: 11px;
  }
  .cal-cell.blank { background: transparent; border: none; }
  .cal-daynum { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
  .cal-cell.today { border-color: var(--ledger); box-shadow: inset 0 0 0 1px var(--ledger); }
  .cal-chip {
    font-size: 10px;
    padding: 1.5px 6px;
    border-radius: 20px;
    margin-bottom: 2px;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-faint); }

  .onboard-box { max-width: 420px; margin: 40px auto; }

  @media (max-width: 780px) {
    #app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 14px 18px; overflow-x: auto; }
    .brand-sub, .nav-label, .sidebar-footer, .nav-divider { display: none; }
    .brand { margin-right: 18px; white-space: nowrap; }
    .nav-item { white-space: nowrap; }
    .main { padding: 22px 18px 50px; }
  }
</style>

<div id="app"><div class="empty-state">불러오는 중…</div></div>

<script>
(function () {
  const LEAVE_TYPES = ["연차", "반차", "병가", "경조사", "기타"];
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];

  let state = {
    loading: true,
    error: null,
    employees: [],
    requests: [],
    currentUserId: null,
    view: "dashboard",
    calMonth: new Date().getMonth(),
    calYear: new Date().getFullYear(),
  };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function fmtDate(d) {
    const dt = typeof d === "string" ? new Date(d) : d;
    return `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, "0")}.${String(dt.getDate()).padStart(2, "0")}`;
  }
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function daysBetweenInclusive(startStr, endStr) {
    const s = new Date(startStr), e = new Date(endStr);
    return Math.round((e - s) / 86400000) + 1;
  }
  function calcAccrued(joinDateStr, asOf) {
    const join = new Date(joinDateStr);
    const now = asOf || new Date();
    if (isNaN(join.getTime()) || join > now) return 0;
    let months = (now.getFullYear() - join.getFullYear()) * 12 + (now.getMonth() - join.getMonth());
    if (now.getDate() < join.getDate()) months -= 1;
    if (months < 12) return Math.max(0, Math.min(11, months));
    const years = Math.floor(months / 12);
    return Math.min(25, 15 + Math.floor((years - 1) / 2));
  }
  function usedLeave(empId) {
    return state.requests
      .filter((r) => r.empId === empId && r.status === "approved" && (r.type === "연차" || r.type === "반차"))
      .reduce((sum, r) => sum + r.days, 0);
  }

  // ---------- storage ----------
  async function loadAll() {
    try {
      let employees = [];
      let requests = [];
      try {
        const e = await window.storage.get("hratd:employees", true);
        employees = e ? JSON.parse(e.value) : [];
      } catch (_) { employees = []; }
      try {
        const r = await window.storage.get("hratd:leave_requests", true);
        requests = r ? JSON.parse(r.value) : [];
      } catch (_) { requests = []; }
      state.employees = employees;
      state.requests = requests;
      if (employees.length && !state.currentUserId) state.currentUserId = employees[0].id;
      state.loading = false;
    } catch (err) {
      state.error = "데이터를 불러오지 못했습니다. 새로고침 해보세요.";
      state.loading = false;
    }
    render();
  }
  async function saveEmployees(list) {
    state.employees = list;
    render();
    try { await window.storage.set("hratd:employees", JSON.stringify(list), true); }
    catch (_) { alert("저장에 실패했습니다. 네트워크를 확인해주세요."); }
  }
  async function saveRequests(list) {
    state.requests = list;
    render();
    try { await window.storage.set("hratd:leave_requests", JSON.stringify(list), true); }
    catch (_) { alert("저장에 실패했습니다. 네트워크를 확인해주세요."); }
  }

  function currentUser() { return state.employees.find((e) => e.id === state.currentUserId) || null; }
  function isAdmin() { const u = currentUser(); return !!u && u.role === "admin"; }

  // ---------- render root ----------
  function render() {
    const app = document.getElementById("app");
    if (state.loading) { app.innerHTML = `<div class="empty-state">불러오는 중…</div>`; return; }
    if (!state.employees.length) { app.innerHTML = renderOnboarding(); bindOnboarding(); return; }

    app.innerHTML = `
      <div class="sidebar">
        <div class="brand">근태 대장</div>
        <div class="brand-sub">사내 근태 · 휴가 관리</div>
        <div class="nav-label">보기</div>
        ${navItem("dashboard", "대시보드")}
        ${navItem("request", "휴가 신청")}
        ${navItem("mine", "내 휴가 내역")}
        ${navItem("calendar", "팀 캘린더")}
        ${isAdmin() ? `<div class="nav-divider"></div><div class="nav-label">관리자</div>${navItem("approvals", "승인 관리")}${navItem("staff", "직원 관리")}` : ""}
        <div class="sidebar-footer">공유 데이터는 이 링크에<br/>접속한 모든 사용자에게<br/>동일하게 표시됩니다.</div>
      </div>
      <div class="main">
        <div class="topbar">
          <div>
            <div class="page-title">${pageTitle()}</div>
            <div class="page-desc">${pageDesc()}</div>
          </div>
          <div class="identity-box">
            👤
            <select id="whoami">
              ${state.employees.map((e) => `<option value="${e.id}" ${e.id === state.currentUserId ? "selected" : ""}>${e.name} · ${e.dept}</option>`).join("")}
            </select>
            <span class="role-tag">${isAdmin() ? "관리자" : "직원"}</span>
          </div>
        </div>
        <div id="view-body">${renderView()}</div>
      </div>
    `;
    bindGlobal();
    bindView();
  }

  function navItem(key, label) {
    return `<button class="nav-item ${state.view === key ? "active" : ""}" data-view="${key}">${label}</button>`;
  }
  function pageTitle() {
    return { dashboard: "대시보드", request: "휴가 신청", mine: "내 휴가 내역", calendar: "팀 캘린더", approvals: "승인 관리", staff: "직원 관리" }[state.view] || "";
  }
  function pageDesc() {
    return {
      dashboard: "오늘의 근태 현황과 내 연차 잔여일수를 한눈에 확인하세요.",
      request: "휴가 종류와 기간을 입력해 신청서를 제출하세요.",
      mine: "내가 신청한 휴가의 처리 상태를 확인하세요.",
      calendar: "이번 달 팀 전체의 휴가 일정입니다.",
      approvals: "대기 중인 휴가 신청을 승인하거나 반려하세요.",
      staff: "직원을 등록하고 관리자 권한을 설정하세요.",
    }[state.view] || "";
  }

  function renderView() {
    if (state.view === "dashboard") return renderDashboard();
    if (state.view === "request") return renderRequestForm();
    if (state.view === "mine") return renderMine();
    if (state.view === "calendar") return renderCalendar();
    if (state.view === "approvals") return isAdmin() ? renderApprovals() : renderNoAccess();
    if (state.view === "staff") return isAdmin() ? renderStaff() : renderNoAccess();
    return "";
  }
  function renderNoAccess() { return `<div class="empty-state">관리자만 볼 수 있는 화면입니다.</div>`; }

  // ---------- Dashboard ----------
  function renderDashboard() {
    const user = currentUser();
    const accrued = calcAccrued(user.joinDate);
    const used = usedLeave(user.id);
    const remaining = Math.max(0, accrued - used);
    const today = todayStr();
    const onLeaveToday = state.requests.filter((r) => r.status === "approved" && r.startDate <= today && r.endDate >= today);
    const pendingCount = state.requests.filter((r) => r.status === "pending").length;

    const cards = [
      { label: "내 잔여 연차", num: `${remaining}일`, sub: `발생 ${accrued}일 · 사용 ${used}일` },
      { label: "오늘 휴가자", num: `${onLeaveToday.length}명`, sub: onLeaveToday.length ? onLeaveToday.map((r) => empName(r.empId)).join(", ") : "전원 출근" },
      { label: "전체 직원 수", num: `${state.employees.length}명`, sub: `관리자 ${state.employees.filter((e) => e.role === "admin").length}명` },
    ];
    if (isAdmin()) cards.push({ label: "대기 중인 승인", num: `${pendingCount}건`, sub: pendingCount ? "확인이 필요합니다" : "모두 처리됨" });

    const recent = [...state.requests].filter((r) => r.empId === user.id).sort((a, b) => b.requestedAt - a.requestedAt).slice(0, 4);

    return `
      <div class="grid grid-4">
        ${cards.map((c) => `<div class="card"><div class="stat-label">${c.label}</div><div class="stat-num">${c.num}</div><div class="stat-sub">${c.sub}</div></div>`).join("")}
      </div>
      <div class="section">
        <div class="section-title">내 최근 신청 내역</div>
        <div class="card" style="padding:0;">
          <table>
            <thead><tr><th>종류</th><th>기간</th><th>일수</th><th>상태</th></tr></thead>
            <tbody>
              ${recent.length ? recent.map(rowMine).join("") : `<tr class="empty-row"><td colspan="4">아직 신청 내역이 없습니다.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="callout">연차 발생 일수는 근로기준법 기준 간이 계산식(1년 미만 매월 1일, 1년 이상 15일 + 2년마다 1일 가산, 최대 25일)으로 자동 산출됩니다. 회사 사규나 실제 법적 기준과 다를 수 있으니 정확한 적용은 인사 담당자에게 확인하세요.</div>
    `;
  }

  function empName(id) { const e = state.employees.find((x) => x.id === id); return e ? e.name : "(알수없음)"; }
  function rowMine(r) {
    return `<tr><td>${r.type}</td><td>${fmtDate(r.startDate)}${r.startDate !== r.endDate ? " ~ " + fmtDate(r.endDate) : ""}</td><td>${r.days}일</td><td>${stampFor(r.status)}</td></tr>`;
  }
  function stampFor(status) {
    if (status === "approved") return `<span class="stamp approved">승인됨</span>`;
    if (status === "rejected") return `<span class="stamp rejected">반려됨</span>`;
    return `<span class="stamp pending">대기중</span>`;
  }

  // ---------- Request form ----------
  function renderRequestForm() {
    return `
      <div class="card" style="max-width:560px;">
        <div class="form-row">
          <div class="field">
            <label>휴가 종류</label>
            <select id="rq-type">${LEAVE_TYPES.map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>시작일</label>
            <input type="date" id="rq-start" value="${todayStr()}" />
          </div>
          <div class="field">
            <label>종료일</label>
            <input type="date" id="rq-end" value="${todayStr()}" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>사유</label>
            <textarea id="rq-reason" placeholder="간단한 사유를 입력하세요"></textarea>
          </div>
        </div>
        <button class="btn btn-primary" id="rq-submit">신청서 제출</button>
      </div>
    `;
  }

  // ---------- Mine ----------
  function renderMine() {
    const mine = [...state.requests].filter((r) => r.empId === state.currentUserId).sort((a, b) => b.requestedAt - a.requestedAt);
    return `
      <div class="card" style="padding:0;">
        <table>
          <thead><tr><th>종류</th><th>기간</th><th>일수</th><th>사유</th><th>상태</th></tr></thead>
          <tbody>
            ${mine.length ? mine.map((r) => `<tr><td>${r.type}</td><td>${fmtDate(r.startDate)}${r.startDate !== r.endDate ? " ~ " + fmtDate(r.endDate) : ""}</td><td>${r.days}일</td><td>${r.reason ? escapeHtml(r.reason) : "-"}</td><td>${stampFor(r.status)}</td></tr>`).join("") : `<tr class="empty-row"><td colspan="5">신청 내역이 없습니다.</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
  }

  // ---------- Calendar ----------
  const TYPE_COLOR = { "연차": ["var(--ledger-tint)", "var(--ledger-dark)"], "반차": ["var(--ledger-tint)", "var(--ledger-dark)"], "병가": ["var(--stamp-red-tint)", "var(--stamp-red)"], "경조사": ["var(--amber-tint)", "var(--amber)"], "기타": ["#E7E5D6", "#6b6d54"] };
  function renderCalendar() {
    const y = state.calYear, m = state.calMonth;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const todayS = todayStr();
    const approved = state.requests.filter((r) => r.status === "approved");

    let cells = "";
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell blank"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayReqs = approved.filter((r) => r.startDate <= dateStr && r.endDate >= dateStr);
      const chips = dayReqs.slice(0, 3).map((r) => {
        const [bg, fg] = TYPE_COLOR[r.type] || TYPE_COLOR["기타"];
        return `<span class="cal-chip" style="background:${bg};color:${fg};">${empName(r.empId)} ${r.type}</span>`;
      }).join("");
      const more = dayReqs.length > 3 ? `<span class="cal-chip" style="color:var(--ink-faint);">+${dayReqs.length - 3}명</span>` : "";
      cells += `<div class="cal-cell ${dateStr === todayS ? "today" : ""}"><div class="cal-daynum">${d}</div>${chips}${more}</div>`;
    }
    const monthLabel = `${y}년 ${m + 1}월`;
    return `
      <div class="card">
        <div class="cal-head">
          <div class="cal-title">${monthLabel}</div>
          <div class="cal-nav">
            <button class="btn btn-ghost btn-sm" id="cal-prev">‹ 이전</button>
            <button class="btn btn-ghost btn-sm" id="cal-next">다음 ›</button>
          </div>
        </div>
        <div class="cal-grid">
          ${DOW.map((d) => `<div class="cal-dow">${d}</div>`).join("")}
          ${cells}
        </div>
      </div>
    `;
  }

  // ---------- Approvals (admin) ----------
  function renderApprovals() {
    const pending = state.requests.filter((r) => r.status === "pending").sort((a, b) => a.requestedAt - b.requestedAt);
    const decided = state.requests.filter((r) => r.status !== "pending").sort((a, b) => b.requestedAt - a.requestedAt).slice(0, 8);
    return `
      <div class="section-title" style="margin-top:0;">대기 중 (${pending.length})</div>
      <div class="card" style="padding:0;">
        <table>
          <thead><tr><th>직원</th><th>종류</th><th>기간</th><th>일수</th><th>사유</th><th></th></tr></thead>
          <tbody>
            ${pending.length ? pending.map((r) => `
              <tr>
                <td class="name-cell">${empName(r.empId)}</td>
                <td>${r.type}</td>
                <td>${fmtDate(r.startDate)}${r.startDate !== r.endDate ? " ~ " + fmtDate(r.endDate) : ""}</td>
                <td>${r.days}일</td>
                <td>${r.reason ? escapeHtml(r.reason) : "-"}</td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="btn btn-approve btn-sm" data-act="approve" data-id="${r.id}">승인</button>
                  <button class="btn btn-reject btn-sm" data-act="reject" data-id="${r.id}">반려</button>
                </td>
              </tr>`).join("") : `<tr class="empty-row"><td colspan="6">대기 중인 신청이 없습니다.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="section">
        <div class="section-title">최근 처리 내역</div>
        <div class="card" style="padding:0;">
          <table>
            <thead><tr><th>직원</th><th>종류</th><th>기간</th><th>상태</th></tr></thead>
            <tbody>
              ${decided.length ? decided.map((r) => `<tr><td class="name-cell">${empName(r.empId)}</td><td>${r.type}</td><td>${fmtDate(r.startDate)}${r.startDate !== r.endDate ? " ~ " + fmtDate(r.endDate) : ""}</td><td>${stampFor(r.status)}</td></tr>`).join("") : `<tr class="empty-row"><td colspan="4">처리 내역이 없습니다.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // ---------- Staff (admin) ----------
  function renderStaff() {
    return `
      <div class="card" style="max-width:640px;">
        <div class="form-row">
          <div class="field"><label>이름</label><input id="st-name" placeholder="홍길동" /></div>
          <div class="field"><label>부서</label><input id="st-dept" placeholder="예: 영업팀" /></div>
        </div>
        <div class="form-row">
          <div class="field"><label>입사일</label><input type="date" id="st-join" value="${todayStr()}" /></div>
          <div class="field">
            <label>권한</label>
            <select id="st-role"><option value="employee">직원</option><option value="admin">관리자</option></select>
          </div>
        </div>
        <button class="btn btn-primary" id="st-add">직원 등록</button>
      </div>
      <div class="section">
        <div class="section-title">전체 직원 (${state.employees.length})</div>
        <div class="card" style="padding:0;">
          <table>
            <thead><tr><th>이름</th><th>부서</th><th>입사일</th><th>권한</th><th>잔여 연차</th><th></th></tr></thead>
            <tbody>
              ${state.employees.map((e) => {
                const remaining = Math.max(0, calcAccrued(e.joinDate) - usedLeave(e.id));
                return `<tr>
                  <td class="name-cell">${e.name}</td>
                  <td class="dept-tag">${e.dept}</td>
                  <td>${fmtDate(e.joinDate)}</td>
                  <td>${e.role === "admin" ? '<span class="stamp approved">관리자</span>' : "직원"}</td>
                  <td>${remaining}일</td>
                  <td style="text-align:right;"><button class="btn-danger-text" data-del="${e.id}">삭제</button></td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderOnboarding() {
    return `
      <div class="onboard-box">
        <div class="card">
          <div class="page-title" style="margin-bottom:6px;">근태 대장 시작하기</div>
          <div class="page-desc" style="margin-bottom:18px;">첫 번째 관리자 계정을 등록하고 시작하세요. 이후 직원 관리 화면에서 팀원을 추가할 수 있습니다.</div>
          <div class="form-row">
            <div class="field"><label>이름</label><input id="ob-name" placeholder="홍길동" /></div>
            <div class="field"><label>부서</label><input id="ob-dept" placeholder="예: 인사팀" /></div>
          </div>
          <div class="form-row">
            <div class="field"><label>입사일</label><input type="date" id="ob-join" value="${todayStr()}" /></div>
          </div>
          <button class="btn btn-primary" id="ob-submit">관리자로 시작하기</button>
        </div>
      </div>
    `;
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  // ---------- bindings ----------
  function bindOnboarding() {
    document.getElementById("ob-submit").onclick = async () => {
      const name = document.getElementById("ob-name").value.trim();
      const dept = document.getElementById("ob-dept").value.trim() || "-";
      const join = document.getElementById("ob-join").value || todayStr();
      if (!name) return alert("이름을 입력해주세요.");
      const emp = { id: uid(), name, dept, joinDate: join, role: "admin" };
      state.currentUserId = emp.id;
      await saveEmployees([emp]);
    };
  }

  function bindGlobal() {
    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.onclick = () => { state.view = btn.dataset.view; render(); };
    });
    const who = document.getElementById("whoami");
    if (who) who.onchange = (e) => { state.currentUserId = e.target.value; render(); };
  }

  function bindView() {
    if (state.view === "request") {
      const typeSel = document.getElementById("rq-type");
      const startI = document.getElementById("rq-start");
      const endI = document.getElementById("rq-end");
      typeSel.onchange = () => { if (typeSel.value === "반차") { endI.value = startI.value; endI.disabled = true; } else { endI.disabled = false; } };
      startI.onchange = () => { if (typeSel.value === "반차") endI.value = startI.value; };
      document.getElementById("rq-submit").onclick = async () => {
        const type = typeSel.value;
        const start = startI.value, end = typeSel.value === "반차" ? startI.value : endI.value;
        const reason = document.getElementById("rq-reason").value.trim();
        if (!start || !end) return alert("날짜를 입력해주세요.");
        if (new Date(end) < new Date(start)) return alert("종료일이 시작일보다 빠를 수 없습니다.");
        const days = type === "반차" ? 0.5 : daysBetweenInclusive(start, end);
        const req = { id: uid(), empId: state.currentUserId, type, startDate: start, endDate: end, days, reason, status: "pending", requestedAt: Date.now() };
        await saveRequests([...state.requests, req]);
        state.view = "mine";
        render();
      };
    }
    if (state.view === "calendar") {
      document.getElementById("cal-prev").onclick = () => { state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; } render(); };
      document.getElementById("cal-next").onclick = () => { state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; } render(); };
    }
    if (state.view === "approvals") {
      document.querySelectorAll("[data-act]").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const act = btn.dataset.act;
          const list = state.requests.map((r) => r.id === id ? { ...r, status: act === "approve" ? "approved" : "rejected" } : r);
          await saveRequests(list);
        };
      });
    }
    if (state.view === "staff") {
      document.getElementById("st-add").onclick = async () => {
        const name = document.getElementById("st-name").value.trim();
        const dept = document.getElementById("st-dept").value.trim() || "-";
        const join = document.getElementById("st-join").value || todayStr();
        const role = document.getElementById("st-role").value;
        if (!name) return alert("이름을 입력해주세요.");
        const emp = { id: uid(), name, dept, joinDate: join, role };
        await saveEmployees([...state.employees, emp]);
      };
      document.querySelectorAll("[data-del]").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.dataset.del;
          if (id === state.currentUserId) return alert("현재 로그인한 계정은 삭제할 수 없습니다.");
          if (!confirm("이 직원을 삭제하시겠습니까? 신청 내역은 유지됩니다.")) return;
          await saveEmployees(state.employees.filter((e) => e.id !== id));
        };
      });
    }
  }

  loadAll();
})();
</script>
